name: Persist Cmd+V handler in source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-persist-paste-handler.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Patch source
        run: python scripts/one-time-persist-paste-handler.py
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Persist Cmd+V paste handler in source"
          git push origin main
