name: One-time fix iPhone 6 family

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-iphone6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Patch source
        run: python scripts/one-time-fix-iphone6.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix iPhone 6 family categorization and export count"
          git push origin main
