name: One-time fix iPhone 6 family

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-fix-iphone6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Patch classifier and categories
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app/page.tsx')
          s = p.read_text()

          s, n1 = re.subn(
              r'  "iPhone 6", "iPhone 6s", "iPhone 7", "iPhone 7 Plus", "iPhone 8", "iPhone 8 Plus",',
              '  "iPhone 6", "iPhone 6 Plus", "iPhone 6s", "iPhone 6s Plus", "iPhone 7", "iPhone 7 Plus", "iPhone 8", "iPhone 8 Plus",',
              s,
              count=1,
          )

          start = s.index('  if (has(/iphone\\s*6\\s*s\\b|iphone\\s*6s\\b/)) return "iPhone 6s";')
          end = s.index('  if (has(/iphone\\s*xs\\s*max/)) return "iPhone XS Max";', start)
          replacement = '''  if (has(/iphone\\s*6\\s*s\\s*plus\\b|iphone\\s*6s\\s*plus\\b/)) return "iPhone 6s Plus";
          if (has(/iphone\\s*6\\s*s\\b|iphone\\s*6s\\b/)) return "iPhone 6s";
          if (has(/iphone\\s*6\\s*plus\\b/)) return "iPhone 6 Plus";
          if (has(/iphone\\s*6(?!\\s*s\\b|s\\b|\\d)/)) return "iPhone 6";
          for (const model of [8, 7]) {
            const pattern = new RegExp(`iphone\\\\s*${model}(?!\\\\d)`);
            if (has(pattern)) return has(/\\bplus\\b/) ? `iPhone ${model} Plus` : `iPhone ${model}`;
          }
'''
          s = s[:start] + replacement + s[end:]

          s, n2 = re.subn(
              r'''      if \(category\) \{\n        totals\.set\(category, \(totals\.get\(category\) \?\? 0\) \+ item\.quantity\);\n        keptUnits \+= item\.quantity;\n      \} else unknown\.push\(\{ \.\.\.item, row: index \+ 1, reason: "Nem található egyező kategória" \}\);''',
              '''      if (category && CATEGORIES.includes(category as typeof CATEGORIES[number])) {\n        totals.set(category, (totals.get(category) ?? 0) + item.quantity);\n        keptUnits += item.quantity;\n      } else unknown.push({ ...item, row: index + 1, reason: category ? `Nem exportálható kategória: ${category}` : "Nem található egyező kategória" });''',
              s,
              count=1,
          )

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Patch counts invalid: categories={n1}, kept={n2}')

          p.write_text(s)
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix iPhone 6 family categorization and export count"
          git push origin main
